<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sketcher — Precision Drawing Tool</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-section toolbar-left">
      <button class="panel-toggle" id="leftPanelToggle" title="Toggle Layers Panel">
        <i class="fas fa-bars"></i>
      </button>
      <div class="logo">
        <i class="fas fa-vector-square"></i>
        <span>SKETCHER</span>
      </div>
    </div>

    <div class="toolbar-section toolbar-center">
      <div class="tool-group">
        <button class="tool-btn" id="selectTool" data-tool="SELECT" title="Select Tool">
          <i class="fas fa-mouse-pointer"></i>
          <span class="tool-label">Select</span>
        </button>
        <div class="toolbar-divider"></div>
        <button class="tool-btn" id="lineBtn" data-tool="LINE" title="Line Tool">
          <i class="fas fa-minus"></i>
          <span class="tool-label">Line</span>
        </button>
        <button class="tool-btn" id="circleBtn" data-tool="CIRCLE" title="Circle Tool">
          <i class="far fa-circle"></i>
          <span class="tool-label">Circle</span>
        </button>
        <button class="tool-btn" id="ellipseBtn" data-tool="ELLIPSE" title="Ellipse Tool">
          <i class="fas fa-circle"></i>
          <span class="tool-label">Ellipse</span>
        </button>
        <button class="tool-btn" id="polylineBtn" data-tool="POLYLINE" title="Polyline Tool">
          <i class="fas fa-wave-square"></i>
          <span class="tool-label">Polyline</span>
        </button>
        <div class="toolbar-divider"></div>
        <button class="tool-btn active" id="gridToggle" title="Toggle Grid">
          <i class="fas fa-border-all"></i>
          <span class="tool-label">Grid</span>
        </button>
        <button class="tool-btn" id="clearBtn" title="Clear All Shapes">
          <i class="fas fa-eraser"></i>
          <span class="tool-label">Clear</span>
        </button>
      </div>
    </div>

    <div class="toolbar-section toolbar-right">
      <div class="tool-group">
        <button class="tool-btn" id="saveBtn" title="Save Project">
          <i class="fas fa-save"></i>
          <span class="tool-label">Save</span>
        </button>
        <button class="tool-btn" id="importBtn" title="Import">
          <i class="fas fa-download"></i>
          <input type="file" id="importInput" accept=".json" hidden />
          <span class="tool-label">Import</span>
        </button>
        <div class="toolbar-divider"></div>
        <button class="tool-btn" id="themeToggle" title="Toggle Theme">
          <i class="fas fa-moon"></i>
          <span class="tool-label">Theme</span>
        </button>
      </div>
      <button class="panel-toggle" id="rightPanelToggle" title="Toggle Properties Panel">
        <i class="fas fa-sliders-h"></i>
      </button>
    </div>
  </div>

  <!-- Main layout -->
  <div class="layout">
    <!-- Left Panel -->
    <div class="panel panel-left" id="leftPanel">
      <div class="panel-header">
        <div class="panel-title">
          <i class="fas fa-layer-group"></i>
          <span>List of Created Objects</span>
        </div>
        <button class="panel-close" id="leftPanelClose">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="panel-search">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search shapes..." id="shapeSearch">
      </div>
      <div class="panel-content" id="leftPanelContent">
        <!-- shape items injected here -->
      </div>
    </div>

    <!-- Canvas -->
    <div class="canvas-wrapper">
      <div class="canvas-area" id="canvas-container">
        <canvas class="webgl"></canvas>
        <svg class="canvas-grid" id="canvasGrid"></svg>
      </div>

      <!-- Canvas Controls -->
      <div class="canvas-controls">
        <div class="control-group">
          <label>
            <i class="fas fa-ruler-combined"></i>
            Grid Size
          </label>
          <input type="range" id="gridSize" min="20" max="100" value="50" step="10">
          <span id="gridSizeValue">50px</span>
        </div>
        <div class="control-group">
          <label>
            <i class="fas fa-adjust"></i>
            Grid Opacity
          </label>
          <input type="range" id="gridOpacity" min="0" max="1" value="0.3" step="0.1">
          <span id="gridOpacityValue">30%</span>
        </div>
      </div>

      <!-- Coordinate Display -->
      <div class="canvas-info">
        <i class="fas fa-crosshairs"></i>
        <span id="canvasCoords">X: 0.00 | Y: 0.00</span>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="panel panel-right" id="rightPanel">
      <div class="panel-header">
        <div class="panel-title">
          <i class="fas fa-cog"></i>
          <span>Properties</span>
        </div>
        <button class="panel-close" id="rightPanelClose">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="panel-content" id="rightPanelContent">
        <div class="empty-state">
          <i class="fas fa-mouse-pointer"></i>
          <p>Select a shape to view properties</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
